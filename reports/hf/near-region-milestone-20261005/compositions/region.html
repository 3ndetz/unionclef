<!doctype html><html lang="en"><body><template><link rel="stylesheet" href="compositions/scene.css"><style>#region-root{position:absolute;inset:0;width:100%;height:100%}</style>
<div id="region-root" data-composition-id="region" data-width="1920" data-height="1080" data-duration="16"><div class="scene">
<div class="kicker"><span>THE SAME SAVED CHECKPOINT</span><span>SEARCH THE REGION</span></div><h1 id="region-title">A radius is not one snapped point.</h1>
<div class="split"><div class="pair"><p class="pill">Historical point drive</p><div class="media"><video id="region-before" class="clip" src="assets/point-history.mp4" muted playsinline data-start="0" data-duration="16" data-media-start="60" data-track-index="0"></video></div><p class="note">Incomplete in its 90-second observation</p></div><div class="pair"><p class="pill">Current region search</p><div class="media"><video id="region-after" class="clip" src="assets/approach.mp4" muted playsinline data-start="0" data-duration="16" data-media-start="110" data-track-index="2"></video></div><p class="note">Searches cells satisfying the exact radius</p></div></div>
<div class="diagram-band"><div class="diagram"><div id="region-zoom-outer" class="zoom-outer"><div id="region-zoom-inner" class="zoom-inner"><div class="radius"><div class="center-cell"></div></div><div id="region-target" class="radius-target"></div></div></div></div><div class="side"><p>Stop at a reachable cell inside the radius.</p><p class="note">Illustrative geometry. Preparation and smartMoves differ between these recordings; this is not a matched timing comparison.</p></div></div>
<div class="footer"><span>Both recordings · 1×</span><span>The original long-running stall remains open.</span></div></div></div>
<script>document.fonts.ready.then(()=>{const tl=gsap.timeline({paused:true});tl.fromTo("#region-title",{x:-28,opacity:0},{x:0,opacity:1,duration:.55,ease:"power3.out"},.1);const target=document.getElementById("region-target").getBoundingClientRect();const box=document.getElementById("region-zoom-outer").getBoundingClientRect();const dx=target.left+target.width/2-(box.left+box.width/2),dy=target.top+target.height/2-(box.top+box.height/2);tl.to("#region-zoom-outer",{scale:1.15,duration:1.5,ease:"power3.inOut"},9);tl.to("#region-zoom-inner",{x:-dx,y:-dy,duration:1.5,ease:"power3.inOut"},9);window.__timelines["region"]=tl;});</script></template></body></html>
