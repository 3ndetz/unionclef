<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920,height=1080">
<script src="assets/gsap.min.js"></script><style>
@font-face{font-family:'Montserrat';font-style:normal;font-weight:900;src:url('assets/montserrat-900.ttf') format('truetype');}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;src:url('assets/ibm-plex-mono-400.ttf') format('truetype');}
*{box-sizing:border-box;margin:0;padding:0;}html,body{width:1920px;height:1080px;overflow:hidden;background:#0b0f14;}
#root{width:100%;height:100%;font-family:'IBM Plex Mono',monospace;color:#e8eef2;background:#0b0f14;}
.clip{position:absolute;inset:0;width:100%;height:100%;}.event-title{display:block;width:100%;font-family:'Montserrat',sans-serif;font-weight:900;font-size:68px;line-height:1.12;letter-spacing:-0.035em;}
.context{display:block;width:100%;font-size:26px;line-height:1.4;color:#3fd0c9;margin-top:16px;}.stage{position:relative;min-height:0;overflow:hidden;}
video{object-fit:contain;background:#0b0f14;}.split{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.pane{display:grid;grid-template-rows:52px 1fr 84px;gap:12px;min-width:0;min-height:0;}.pane-label{font-size:28px;line-height:1.4;color:#3fd0c9;}.picture{position:relative;min-height:0;}.pane-result{font-size:27px;line-height:1.4;}
footer{display:flex;align-items:center;justify-content:space-between;gap:30px;}.caption{display:block;width:calc(100% - 210px);font-size:29px;line-height:1.45;transform-origin:0 50%;}.badge{display:block;width:180px;font-size:27px;color:#3fd0c9;text-align:right;transform-origin:100% 50%;}
.measurements{height:100%;display:flex;flex-direction:column;justify-content:space-around;gap:22px;}.measure-heading{display:flex;align-items:baseline;gap:36px;}.measure strong{font-family:'Montserrat',sans-serif;font-size:90px;font-weight:900;}.measure p{font-size:30px;line-height:1.45;}.bar{height:14px;background:#243237;margin:16px 0;}.bar span{display:block;width:100%;height:100%;background:#3fd0c9;}.scope{font-size:29px;line-height:1.7;}
.closing{height:100%;display:flex;flex-direction:column;justify-content:center;gap:48px;}.closing p:first-child{font-family:'Montserrat',sans-serif;font-weight:900;font-size:66px;}.closing p:last-child{font-size:36px;line-height:1.6;max-width:1400px;}
</style></head><body><div id="root" data-composition-id="shelter-report" data-duration="60" data-width="1920" data-height="1080"><div id="shelter-payoff-slot" class="clip" data-composition-id="shelter-payoff" data-composition-src="compositions/shelter-payoff.html" data-start="0" data-duration="6" data-track-index="0" data-width="1920" data-height="1080"></div><div id="shelter-saved-entry-slot" class="clip" data-composition-id="shelter-saved-entry" data-composition-src="compositions/shelter-saved-entry.html" data-start="6" data-duration="16" data-track-index="0" data-width="1920" data-height="1080"></div><div id="shelter-refresh-slot" class="clip" data-composition-id="shelter-refresh" data-composition-src="compositions/shelter-refresh.html" data-start="22" data-duration="14" data-track-index="0" data-width="1920" data-height="1080"></div><div id="shelter-morning-slot" class="clip" data-composition-id="shelter-morning" data-composition-src="compositions/shelter-morning.html" data-start="36" data-duration="10" data-track-index="0" data-width="1920" data-height="1080"></div><div id="shelter-measurements-slot" class="clip" data-composition-id="shelter-measurements" data-composition-src="compositions/shelter-measurements.html" data-start="46" data-duration="10" data-track-index="0" data-width="1920" data-height="1080"></div><div id="shelter-close-slot" class="clip" data-composition-id="shelter-close" data-composition-src="compositions/shelter-close.html" data-start="56" data-duration="4" data-track-index="0" data-width="1920" data-height="1080"></div></div><script>window.__timelines['shelter-report']=gsap.timeline({paused:true});</script></body></html>
