<!doctype html><html lang="en"><head><meta charset="UTF-8"></head><body><template>
<style>#shelter-payoff-root {position:absolute;inset:0;width:100%;height:100%;display:grid;grid-template-rows:132px 1fr 110px;gap:20px;padding:40px 64px;background:#0b0f14;color:#e8eef2;overflow:hidden;} #shelter-payoff-title, #shelter-payoff-context {opacity:0;}</style>
<div id="shelter-payoff-root" data-composition-id="shelter-payoff" data-duration="6" data-width="1920" data-height="1080">
<header><h1 id="shelter-payoff-title" class="event-title">A hole for the night</h1><p id="shelter-payoff-context" class="context">Retained water entry · actual shelter task</p></header>
<div class="stage"><video id="payoff-video" class="clip" src="assets/native.mp4" muted playsinline data-start="0" data-duration="6" data-media-start="4.2" data-playback-rate="2" data-track-index="0"></video></div>
<footer><p id="shelter-payoff-caption" class="caption">Leave the pool, dig a dry shaft, close the roof.</p><span id="shelter-payoff-badge" class="badge">2×</span></footer>
</div>
<script>
const tl=gsap.timeline({paused:true});
// Waterfall-entry: binary reveal, one direction, overlap at the lighter line.
tl.set('#shelter-payoff-title',{opacity:1,y:80},0.1).to('#shelter-payoff-title',{y:0,duration:0.18,ease:'power4.out'},0.1);
tl.set('#shelter-payoff-context',{opacity:1,y:45},0.263).to('#shelter-payoff-context',{y:0,duration:0.15,ease:'power4.out'},0.263);
// Smooth spring-pop-entrance: no overshoot and no loop on the held measurement.
tl.fromTo('#shelter-payoff-caption',{scale:0,opacity:0},{scale:1,opacity:1,duration:0.45,ease:'power3.out'},0.18);
tl.fromTo('#shelter-payoff-badge',{scale:0,opacity:0},{scale:1,opacity:1,duration:0.4,ease:'power3.out'},0.24);
window.__timelines['shelter-payoff']=tl;
</script></template></body></html>
