# unionclef autotest stand (docs/AUTOTESTING.md, phase 0) — self-contained,
# runs on the Mac (mactrindetz) next to the production mineswarm stack without
# touching it: own network, own container names, own run/ dir.
#
# Client image is mineswarm's headless MC client (PortableMC -> Fabric 1.21.11,
# py4j baked in) — built from ../mineswarm/game/minecraft/docker. The fresh
# unionclef jar is placed into ./run/mods by deploy/autotest.sh.
#
#   docker compose -f deploy/compose.test.yml up -d
#   docker compose -f deploy/compose.test.yml down
#
# noVNC debug view of the client: http://<mac>:5820

networks:
  uctest:
    name: uctest

services:
  test-server:
    image: itzg/minecraft-server:latest
    container_name: uctest-server
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "1.21.11"
      ONLINE_MODE: "FALSE"
      LEVEL_TYPE: "minecraft:flat"
      GENERATE_STRUCTURES: "false"   # villages on the course ruin determinism
      DIFFICULTY: "peaceful"
      MODE: "survival"
      ALLOW_FLIGHT: "TRUE"          # big slime bounces trip the vanilla flight kick
      SPAWN_PROTECTION: "0"
      RCON_PASSWORD: "uctest"
      VIEW_DISTANCE: "12"
    networks: [uctest]
    restart: unless-stopped

  # Survival world for @gamer / tungsten_speedrun testing (real terrain, trees,
  # mobs, easy difficulty). Separate from the flat determinism stand. Start with
  #   docker compose -f deploy/compose.test.yml --profile gamer up -d
  gamer-server:
    image: itzg/minecraft-server:latest
    container_name: uctest-gamer-server
    profiles: [gamer]
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "1.21.11"
      ONLINE_MODE: "FALSE"
      LEVEL_TYPE: "minecraft:normal"
      SEED: "12345"                  # deterministic-ish start
      GENERATE_STRUCTURES: "true"
      DIFFICULTY: "easy"
      MODE: "survival"
      SPAWN_PROTECTION: "0"
      RCON_PASSWORD: "uctest"
      VIEW_DISTANCE: "12"
    networks: [uctest]
    restart: unless-stopped

  mc-tester1:
    image: mineswarm-mc:amd64
    platform: linux/amd64
    container_name: uctest-mc-tester1
    environment:
      MC_USERNAME: "tester1"
      MC_MAX_MEM: "3G"
      # THE FRAME RATE IS THE WHOLE PVP SUITE'S BLOCKER, AND THIS IS THE UNTOUCHED LEVER.
      # The stand runs at 4-8 fps against its own 14.0 validity floor, and run_suite.py:326 already
      # established the cause is a single-threaded SOFTWARE render ceiling rather than foreign load
      # (24 cores with ~47% idle, 106 GB of 128 free). options.txt is already as lean as it goes —
      # renderDistance 5, simulationDistance 5, particles minimal, ao/entityShadows off — but the
      # clients were still rendering at 1920x1080, i.e. 2.07 MILLION pixels per frame on llvmpipe.
      # Fill rate is the one thing that dominates a software rasteriser, and nothing had touched it.
      # 854x480 is 410k pixels — five times less to shade per frame.
      # Only noVNC and the bench's screen capture see this resolution; every measurement the suite
      # makes is read over py4j or rcon, not off the pixels.
      DISPLAY_WIDTH: "854"
      DISPLAY_HEIGHT: "480"
    ports:
      # Host ports are overridable: a dev box often already runs a real MC client
      # (which holds the in-mod MCP port) and the stand must not fight it for the
      # binding. The test runner itself talks py4j over `docker exec`, so these
      # publishes are for humans/LAN only and are safe to remap.
      - "${UCTEST_VNC_PORT:-5820}:5800"            # noVNC (debug only)
      - "${UCTEST_MCP_PORT:-25350}:25350"          # in-mod MCP server (LAN control surface)
    volumes:
      - ./run/data/tester1:/mc-data
      - ./run/mods:/mc-data/mods:ro
    networks: [uctest]
    depends_on: [test-server]
    restart: unless-stopped

  # Victim client for PVP tests (pvp_test.py). Same image/mods; just stands
  # there and gets hit. Started with --profile pvp so slime tests stay light:
  #   docker compose -f deploy/compose.test.yml --profile pvp up -d
  mc-tester2:
    image: mineswarm-mc:amd64
    platform: linux/amd64
    container_name: uctest-mc-tester2
    profiles: [pvp]
    environment:
      MC_USERNAME: "tester2"
      MC_MAX_MEM: "3G"
      # Same as tester1 — see the note there. The opponent is a client too, and on a duel course the
      # two of them share the same cores, so leaving this one at 1920x1080 would cap the pair.
      DISPLAY_WIDTH: "854"
      DISPLAY_HEIGHT: "480"
    ports:
      - "${UCTEST_VNC2_PORT:-5821}:5800"           # noVNC (debug only)
    volumes:
      - ./run/data/tester2:/mc-data
      - ./run/mods:/mc-data/mods:ro
    networks: [uctest]
    depends_on: [test-server]
    restart: unless-stopped
